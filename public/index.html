<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saturn AI-Pilot PRO · Dresden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hdr">
  <div class="brand"><span class="logo" aria-hidden="true">S</span>
    <div><h1>AI-Pilot <em>PRO</em></h1><p>Saturn Altmarkt-Galerie Dresden</p></div></div>
</header>

<main id="main">
  <section id="quiz" aria-live="polite"></section>
  <section id="result" hidden aria-live="polite"></section>
</main>

<div id="chat" class="chat" role="dialog" aria-modal="true" aria-labelledby="chatTitle" hidden>
  <div class="chat-head"><h2 id="chatTitle">KI-Berater</h2>
    <button type="button" class="icon-btn" id="chatClose" aria-label="Chat schließen">✕</button></div>
  <div id="chatMsgs" class="chat-msgs" aria-live="polite"></div>
  <div id="chatQuick" class="chat-quick">
    <button type="button" class="chip">Welches Handy hat die beste Kamera?</button>
    <button type="button" class="chip">Gutes Handy bis 400 €?</button>
    <button type="button" class="chip">iPhone oder Android?</button>
  </div>
  <form id="chatForm" class="chat-form">
    <label for="chatInput" class="sr">Deine Frage</label>
    <input id="chatInput" maxlength="1000" autocomplete="off" placeholder="Frag mich etwas…">
    <button type="submit" id="chatSend" aria-label="Senden">➤</button>
  </form>
</div>

<nav class="nav" aria-label="Hauptnavigation">
  <button type="button" id="navHome" class="nb on" aria-current="page"><span aria-hidden="true">🏠</span>Berater</button>
  <button type="button" id="navAll" class="nb"><span aria-hidden="true">📱</span>Alle Geräte</button>
  <button type="button" id="navChat" class="nb"><span aria-hidden="true">💬</span>KI-Chat</button>
</nav>

<script src="data/phones.js"></script>
<script src="app.js"></script>
</body>
</html>
